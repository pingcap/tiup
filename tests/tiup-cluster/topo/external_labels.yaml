server_configs:
  tikv:
    storage.reserve-space: 1K

tidb_servers:
  - host: n1

pd_servers:
  - host: n1

tikv_servers:
  - host: n1

monitoring_servers:
  - host: n1
    rule_dir: /tmp/local/prometheus
    external_labels:
      environment: production
      region: us-east-1
grafana_servers:
  - host: n1
    dashboard_dir: /tmp/local/grafana
alertmanager_servers:
  - host: n1
    config_file: /tmp/local/alertmanager/alertmanager.yml
