---
name: release-tiup

on:
  push:
    branches:
      - ci/gh-*
      - master
    paths-ignore:
      - "**.html"
      - "**.md"
      - "CNAME"
      - "LICENSE"
      - "doc/**"
      - "embed/templates/examples/**"
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      git-ref:
        description: git ref
        required: true
      staging-mirror:
        description: Publish to staging mirror
        required: false
        type: boolean

jobs:
  resolve:
    name: Resolve mirror environment
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      environment: ${{ steps.select.outputs.environment }}
    steps:
      - name: Select the mirror environment
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          STAGING_MIRROR: ${{ inputs.staging-mirror }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$STAGING_MIRROR" = "true" ]; then
            echo "environment=staging" >> "$GITHUB_OUTPUT"
          else
            echo "environment=production" >> "$GITHUB_OUTPUT"
          fi

  prepare:
    name: Prepare the release
    # Resolve the exact commit, version and refs. All compilations happen in the
    # build job; the linux/amd64 build also uploads the publishing driver.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      commit: ${{ steps.commit.outputs.commit }}
      REL_VER: ${{ steps.version.outputs.REL_VER }}
      STAGING: ${{ steps.check_staging.outputs.STAGING }}
      GIT_REF: ${{ steps.get_git.outputs.GIT_REF }}
      COMMIT_TIMESTAMP: ${{ steps.get_git.outputs.COMMIT_TIMESTAMP }}
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.git-ref }}
          fetch-depth: 0

      - name: Record the checked-out commit
        id: commit
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Check if this is a staging build
        id: check_staging
        if: github.event_name != 'release'
        run: |
          BRANCH_NAME=$(git rev-parse --abbrev-ref HEAD)
          if [ "$BRANCH_NAME" != "master" ]; then
            STAGING_VER=$(git describe --tags | sed 's/-[0-9]*-[^-]*$//')-$(echo $BRANCH_NAME | sed 's|/|.|g')
          else
            STAGING_VER=$(git describe --tags | sed 's/-[^-]*$//' | sed -r 's/(-[^-]*$)/-nightly\1/')
          fi
          echo "STAGING=$STAGING_VER" >> "$GITHUB_OUTPUT"

      - name: Get git ref and commit
        id: get_git
        # when empty, it will be determined by Makefile
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            echo "GIT_REF=${GITHUB_REF/refs\/tags\//}" >> "$GITHUB_OUTPUT"
          elif [[ $GITHUB_REF == refs/heads/* ]]; then
            echo "GIT_REF=${GITHUB_REF/refs\/heads\//}" >> "$GITHUB_OUTPUT"
          fi
          COMMIT_TIMESTAMP=$(git show --no-patch --no-notes --pretty='%aI')
          echo "COMMIT_TIMESTAMP=$COMMIT_TIMESTAMP" >> "$GITHUB_OUTPUT"

      - name: Resolve the release version
        id: version
        env:
          STAGING: ${{ steps.check_staging.outputs.STAGING }}
        run: |
          if [ -n "$STAGING" ]; then
            REL_VER="$STAGING"
          else
            REL_VER=$(git describe --tags --always)
          fi
          echo "REL_VER=$REL_VER" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.os }}-${{ matrix.arch }}
    # The repository builds are network-independent; only the mirror interaction
    # in the release job needs the self-hosted runner set.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: prepare
    strategy:
      fail-fast: true
      matrix:
        os:
          - "linux"
          - "darwin"
        arch:
          - "amd64"
          - "arm64"
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'

      - name: Build for ${{ matrix.os }}-${{ matrix.arch }}
        id: build
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          GITREF: ${{ needs.prepare.outputs.GIT_REF }}
          STAGING: ${{ needs.prepare.outputs.STAGING }}
          REL_VER: ${{ needs.prepare.outputs.REL_VER }}
          actor: ${{ github.actor }}
          event: ${{ github.event_name }}
        run: |
          export GOPATH=${GITHUB_WORKSPACE}/go
          export PATH=$PATH:$GOPATH/bin

          if [ -n "$STAGING" ]; then
            export EXTRA_LDFLAGS="-X \"github.com/${{ github.repository }}/pkg/version.TiUPVerName=$STAGING\""
          fi

          BUILD_FLAGS='-trimpath -mod=readonly -modcacherw -buildvcs=false' make build && \
          BUILD_FLAGS='-trimpath -mod=readonly -modcacherw -buildvcs=false' make ctl && \
          echo "Build success."

          checksum_file=checksum.${{ matrix.os }}-${{ matrix.arch }}.txt
          checksum_header="TiUP $REL_VER (${actor}@${event}) ${{ github.run_id }}"
          echo ${checksum_header} > ${checksum_file}
          echo "sha256sum:" >> ${checksum_file}
          sha256sum bin/* >> ${checksum_file}
          echo "b2sum:" >> ${checksum_file}
          b2sum bin/* >> ${checksum_file}
          cat ${checksum_file}

      - name: Upload the tiup driver for publishing
        if: matrix.os == 'linux' && matrix.arch == 'amd64'
        uses: actions/upload-artifact@v7
        with:
          name: tiup-linux-amd64
          path: bin/tiup
          retention-days: 1
          if-no-files-found: error

      - name: Upload the build output
        uses: actions/upload-artifact@v7
        with:
          name: tiup-bin-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            bin
            checksum.${{ matrix.os }}-${{ matrix.arch }}.txt
          retention-days: 1
          if-no-files-found: error

  release:
    # Only mirror interaction runs here: the internal TIUP server is reachable
    # from this runner set. The job downloads the build output and the publishing
    # driver, fetches root.json from the selected mirror, packages and publishes.
    runs-on: arc-runner-set-tiup-release
    timeout-minutes: 30
    needs:
      - resolve
      - prepare
      - build
    environment: ${{ needs.resolve.outputs.environment }}
    outputs:
      REL_VER: ${{ needs.prepare.outputs.REL_VER }}
    strategy:
      fail-fast: true
      matrix:
        os:
          - "linux"
          - "darwin"
        arch:
          - "amd64"
          - "arm64"
    steps:
      - name: Validate mirror credentials
        env:
          TIUP_SERVER: ${{ secrets.TIUP_SERVER }}
          TIUP_COMP_KEY: ${{ secrets.TIUP_COMP_KEY }}
        run: |
          if [ -z "${TIUP_SERVER:-}" ] || [ -z "${TIUP_COMP_KEY:-}" ]; then
            echo "::error::The '${{ needs.resolve.outputs.environment }}' environment is missing TIUP_SERVER or TIUP_COMP_KEY."
            exit 1
          fi
          echo "Publishing to the '${{ needs.resolve.outputs.environment }}' environment"
          echo "Mirror fingerprint: $(printf '%s' "${TIUP_SERVER%/}" | sha256sum | cut -d' ' -f1)"

      - name: Download the build output
        uses: actions/download-artifact@v8
        with:
          name: tiup-bin-${{ matrix.os }}-${{ matrix.arch }}
          path: ${{ github.workspace }}

      - name: Download the tiup driver built from this commit
        uses: actions/download-artifact@v8
        with:
          name: tiup-linux-amd64
          path: ${{ runner.temp }}/tiup-bin

      - name: Package components
        id: packaging
        env:
          ARCH: ${{ matrix.os }}-${{ matrix.arch }}
          REL_VER: ${{ needs.prepare.outputs.REL_VER }}
          COMMIT_TIMESTAMP: ${{ needs.prepare.outputs.COMMIT_TIMESTAMP }}
          TIUP_SERVER: ${{ secrets.TIUP_SERVER }}
        run: |
          TMP_DIR=$(mktemp -d)
          export TIUP_HOME="$TMP_DIR/home"
          echo "TIUP_HOME=$TIUP_HOME" >> "$GITHUB_OUTPUT"
          echo "TIUP_BIN=$TIUP_HOME/bin/tiup" >> "$GITHUB_OUTPUT"

          rm -rf $TIUP_HOME && mkdir -p $TIUP_HOME/{bin,keys}
          cp "${{ runner.temp }}/tiup-bin/tiup" $TIUP_HOME/bin/tiup
          chmod 755 $TIUP_HOME/bin/tiup
          $TIUP_HOME/bin/tiup --version >/dev/null

          MIRROR="${TIUP_SERVER%/}"
          curl -fsSL "$MIRROR/root.json" -o $TIUP_HOME/bin/root.json

          mkdir -p package
          cp $TIUP_HOME/bin/root.json bin/root.json

          # Artifact download does not preserve file modes; restore the
          # executable bits before packaging the binaries.
          chmod 755 bin/tiup*

          # make tar reproducible
          TAR="tar --sort=name --mtime=$COMMIT_TIMESTAMP --owner=0 --group=0 --numeric-owner"

          # package all binaries to upload to github release asset
          ${TAR} -czf tiup-${REL_VER}-${ARCH}.tar.gz bin checksum.${{ matrix.os }}-${{ matrix.arch }}.txt

          # package each component
          # tiup-ctl is destributed with other components, so not packaging / publishing here
          ${TAR} -C bin -czf package/tiup-${REL_VER}-${ARCH}.tar.gz tiup
          ${TAR} -C bin -czf package/cluster-${REL_VER}-${ARCH}.tar.gz tiup-cluster
          ${TAR} -C bin -czf package/dm-${REL_VER}-${ARCH}.tar.gz tiup-dm
          ${TAR} -C bin -czf package/playground-${REL_VER}-${ARCH}.tar.gz tiup-playground
          [ -e bin/tiup-playground-ng ] && ${TAR} -C bin -czf package/playground-ng-${REL_VER}-${ARCH}.tar.gz tiup-playground-ng
          ${TAR} -C bin -czf package/client-${REL_VER}-${ARCH}.tar.gz tiup-client
          ${TAR} -C bin -czf package/server-${REL_VER}-${ARCH}.tar.gz tiup-server

      - name: Publish packages
        env:
          TIUP_SERVER: ${{ secrets.TIUP_SERVER }}
          TIUP_COMP_KEY: ${{ secrets.TIUP_COMP_KEY }}
          TIUP_HOME: ${{ steps.packaging.outputs.TIUP_HOME }}
          TIUP_BIN: ${{ steps.packaging.outputs.TIUP_BIN }}
          REL_VER: ${{ needs.prepare.outputs.REL_VER }}
          ARCH: ${{ matrix.os }}-${{ matrix.arch }}
          tiup_desc: "TiUP is a command-line component management tool that can help to download and install TiDB platform components to the local system"
          cluster_desc: "Deploy a TiDB cluster for production"
          dm_desc: "Data Migration Platform manager"
          playground_desc: "Bootstrap a local TiDB cluster for fun"
          client_desc: "Client to connect playground"
          server_desc: "TiUP publish/cache server"
        run: |
          MIRROR="${TIUP_SERVER%/}"
          ${TIUP_BIN} mirror set "${MIRROR}"

          printf '%s' "$TIUP_COMP_KEY" | base64 -d > $TIUP_HOME/keys/private.json
          chmod 600 $TIUP_HOME/keys/private.json

          # add a random delay before actually publishing, this can help reduce manifest conflict
          # when there are multiple jobs running in parallel
          sleep $(( RANDOM % 10 ))s
          ${TIUP_BIN} mirror publish tiup ${REL_VER} package/tiup-${REL_VER}-${ARCH}.tar.gz tiup --arch ${{ matrix.arch }} --os ${{ matrix.os }} --desc="${tiup_desc}"
          ${TIUP_BIN} mirror publish cluster ${REL_VER} package/cluster-${REL_VER}-${ARCH}.tar.gz tiup-cluster --arch ${{ matrix.arch }} --os ${{ matrix.os }} --desc="${cluster_desc}"
          ${TIUP_BIN} mirror publish dm ${REL_VER} package/dm-${REL_VER}-${ARCH}.tar.gz tiup-dm --arch ${{ matrix.arch }} --os ${{ matrix.os }} --desc="${dm_desc}" --standalone
          ${TIUP_BIN} mirror publish playground ${REL_VER} package/playground-${REL_VER}-${ARCH}.tar.gz tiup-playground --arch ${{ matrix.arch }} --os ${{ matrix.os }} --desc="${playground_desc}"
          [ -e "package/playground-ng-${REL_VER}-${ARCH}.tar.gz" ] && ${TIUP_BIN} mirror publish playground-ng ${REL_VER} package/playground-ng-${REL_VER}-${ARCH}.tar.gz tiup-playground-ng --arch ${{ matrix.arch }} --os ${{ matrix.os }} --desc="${playground_desc} (beta)"
          ${TIUP_BIN} mirror publish client ${REL_VER} package/client-${REL_VER}-${ARCH}.tar.gz tiup-client --arch ${{ matrix.arch }} --os ${{ matrix.os }} --desc="${client_desc}"
          ${TIUP_BIN} mirror publish server ${REL_VER} package/server-${REL_VER}-${ARCH}.tar.gz tiup-server --arch ${{ matrix.arch }} --os ${{ matrix.os }} --desc="${server_desc}" --hide --standalone

      - name: Upload the all-in-one tarball to GitHub release
        uses: ncipollo/release-action@v1
        if: github.event_name == 'release'
        with:
          allowUpdates: true
          artifacts: tiup-${{ needs.prepare.outputs.REL_VER }}-${{ matrix.os }}-${{ matrix.arch }}.tar.gz
          artifactContentType: application/gzip
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true
          prerelease: ${{ github.event.release.prerelease }}
          token: ${{ secrets.GITHUB_TOKEN }}

  brew-upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: release
    steps:
      - name: Check out brew code
        uses: actions/checkout@v6
        continue-on-error: true
        if: github.event_name == 'release'
        with:
          repository: pingcap/homebrew-brew
          persist-credentials: false
          ref: master
          path: ${{ github.workspace }}/homebrew-brew
          fetch-depth: 0

      - name: Update and Check tiup version
        id: update_version
        working-directory: ${{ github.workspace }}/homebrew-brew
        continue-on-error: true
        if: github.event_name == 'release'
        run: |
          sed -i 's/version.*/version "${{ needs.release.outputs.REL_VER }}"/g'  Formula/tiup.rb
          sed -i 's/tag:.*/tag:      "${{ needs.release.outputs.REL_VER }}"/g'  Formula/tiup.rb
          cat Formula/tiup.rb

      - name: Push new homebrew
        uses: actions-js/push@master
        continue-on-error: true
        if: github.event_name == 'release'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          directory: ${{ github.workspace }}/homebrew-brew
          message: "tiup: ${{ needs.release.outputs.REL_VER }}"
          branch: master
          repository: pingcap/homebrew-brew
